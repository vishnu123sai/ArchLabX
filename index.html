
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArchLabX | Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #f04438;
    --black: #111111;
    --muted: #777777;
    --bg: #fcfbfa;
}

body {
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--black);
    overflow-x: hidden;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(
        circle,
        rgba(240,68,56,0.07),
        transparent 70%
    );
    pointer-events: none;
    z-index: -1;
}

/* Header */
header {
    width: 100%;
    padding: 28px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeDown 1s ease;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    font-size: 35px;
    color: var(--red);
}

.logo-name {
    font-family: Georgia, serif;
    font-size: 30px;
}

.header-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
}

/* Main */
main {
    min-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px 90px;
}

.eyebrow {
    font-size: 12px;
    letter-spacing: 6px;
    margin-bottom: 32px;
    color: #444;
    animation: fadeUp 1s ease;
}

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(65px, 12vw, 175px);
    font-weight: 500;
    letter-spacing: -9px;
    line-height: 1.1;
    margin-bottom: 28px;
    animation: fadeUp 1.2s ease;
}

h1 span {
    color: var(--red);
}

/* Status */
.status {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    padding: 13px 26px;
    border: 1px solid rgba(240,68,56,.4);
    border-radius: 50px;
    color: var(--red);
    background: rgba(240,68,56,.045);
    font-size: 15px;
    letter-spacing: 1px;
    margin-bottom: 35px;
    animation: fadeUp 1.4s ease;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 12px rgba(240,68,56,.5);
    animation: pulse 1.8s infinite;
}

/* Description */
.description {
    font-family: Georgia, serif;
    font-size: clamp(20px, 3vw, 27px);
    line-height: 1.5;
    max-width: 620px;
    color: #252525;
    margin-bottom: 14px;
    animation: fadeUp 1.6s ease;
}

.sub-description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
    max-width: 460px;
    animation: fadeUp 1.8s ease;
}

/* Decorative line */
.divider {
    width: 55px;
    height: 2px;
    background: var(--red);
    margin: 35px 0;
    opacity: .8;
}

/* Footer */
footer {
    position: absolute;
    bottom: 25px;
    left: 8%;
    right: 8%;
    display: flex;
    justify-content: space-between;
    color: #999;
    font-size: 11px;
    letter-spacing: 1px;
}

/* Animations */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
}

/* Responsive */
@media(max-width: 600px) {
    header {
        justify-content: center;
        padding: 25px 15px;
    }

    .header-label {
        display: none;
    }

    main {
        min-height: 80vh;
        padding: 50px 20px 80px;
    }

    h1 {
        font-size: 16vw;
        letter-spacing: -5px;
    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: 4px;
    }

    .description {
        font-size: 21px;
    }

    .sub-description {
        font-size: 12px;
    }

    footer {
        position: relative;
        bottom: auto;
        padding: 20px;
        left: auto;
        right: auto;
        gap: 12px;
        text-align: center;
        justify-content: center;
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <span class="logo-icon">✳</span>
        <span class="logo-name">ArchLabX</span>
    </div>

    <div class="header-label">NAYAKAMS-TECH</div>
</header>

<main>

    <div class="eyebrow">N A Y A K A M S – T E C H</div>

    <h1>ArchLab<span>X</span></h1>

    <div class="status">
        <span class="status-dot"></span>
        COMING SOON
    </div>

    <p class="description">
        Ideas into Innovation.
        Something exciting is taking shape.
    </p>

    <p class="sub-description">
        We're building something meaningful.
        A new experience is on its way.
        Stay tuned for what's next.
    </p>

    <div class="divider"></div>

</main>

<footer>
    <span>© 2026 ArchLabX</span>
    <span>BUILT BY NAYAKAMS-TECH</span>
</footer>

</body>
</html>
